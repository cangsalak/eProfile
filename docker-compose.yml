version: '3.8'

services:
  eprofile-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tactic_eprofile_app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
    ports:
      - "8085:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-eprofile-jwt-secret-key-change-in-production-random-min-32-chars}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1024m

