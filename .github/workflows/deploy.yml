name: eProfile CI & CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: 🧪 Quality Gate (Lint & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧩 Module Sync Check
        run: npm run module:sync

      - name: 🗄️ Database Merge & Generate
        run: npm run db:generate

      - name: 🔎 TypeScript Verification
        run: npx tsc --noEmit

      - name: 🧹 ESLint Verification
        run: npm run lint

  deploy-to-server:
    name: 🚀 Deploy to Production Server
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📡 Trigger Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Connecting to production server..."
            cd ${{ secrets.SERVER_PROJECT_PATH || '/var/www/eprofile' }}
            
            # Ensure script is executable and run deployment
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
